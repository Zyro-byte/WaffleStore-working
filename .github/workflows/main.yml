
name: Sync WaffleStore PR #5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wafflestore-pr5
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream PR #5
        run: |
          git remote add upstream \
            https://github.com/nxtcoreee3/WaffleStore.git

          git fetch upstream \
            refs/pull/5/head:refs/remotes/upstream/pr-5

      - name: Apply PR commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/nxtcoreee3/WaffleStore/pulls/5/commits?per_page=100" \
            --jq '.[].sha' > "$RUNNER_TEMP/commits.txt"

          while IFS= read -r SHA; do
            echo "Applying $SHA"

            git fetch upstream "$SHA"

            if git merge-base --is-ancestor "$SHA" HEAD; then
              echo "Already applied"
              continue
            fi

            if git cherry-pick -x "$SHA"; then
              echo "Applied successfully"
            else
              if [ -z "$(git ls-files -u)" ] && \
                 git diff --cached --quiet; then
                git cherry-pick --skip
              else
                git cherry-pick --abort
                echo "Conflict in $SHA"
                exit 1
              fi
            fi
          done < "$RUNNER_TEMP/commits.txt"

      - name: Push changes
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SYNC_TOKEN" ]; then
            echo "Missing SYNC_TOKEN secret"
            exit 1
          fi

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" \
            | base64 -w 0)

          git -c \
            "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:${{ github.ref_name }}"

      - name: Done
        run: echo "PR #5 synchronized successfully!"
