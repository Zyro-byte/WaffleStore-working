name: Build and Publish WaffleStore IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ipa.yml'
      - 'WaffleStore.xcodeproj/project.pbxproj'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waffle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -project WaffleStore.xcodeproj -scheme WaffleStore \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee dist/build.log
          mkdir -p build/package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/WaffleStore.app build/package/Payload/WaffleStore.app
          (cd build/package && zip -qry "$GITHUB_WORKSPACE/dist/WaffleStore-unsigned.ipa" Payload)
          if [ -f scripts/verify-ipa.py ]; then
            python3 scripts/verify-ipa.py dist/WaffleStore-unsigned.ipa | tee dist/verification.json
          fi
          for f in build/Native/unicorn-tci-corresponding-source.tar.gz build/Native/UNICORN-COPYING build/Native/ipatool-sap-corresponding-source.tar.gz build/Native/IPATOOL-LICENSE; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WaffleStore-unsigned-IPA
          path: dist/
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.3.0-fix-${GITHUB_SHA:0:7}"
          gh release create "$TAG" dist/WaffleStore-unsigned.ipa dist/*-corresponding-source.tar.gz dist/UNICORN-COPYING dist/IPATOOL-LICENSE \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "WaffleStore $TAG" \
            --notes "Unsigned IPA. Requires signing before installation. Review upstream redistribution rights before publishing."
