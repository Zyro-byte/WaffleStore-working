name: Build IPA
on:
  push:
    branches: [main, 'feature/**', 'release/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source revision (original: upstream-wafflestore-2.2.2)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  ipa:
    name: Build Debug IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Build and package unsigned IPA
        env:
          CONFIGURATION: Debug
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/toolchain.txt
          xcodebuild -project WaffleStore.xcodeproj -scheme WaffleStore \
            -configuration "$CONFIGURATION" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee artifacts/build.log
          mkdir -p build/package/Payload
          ditto "build/DerivedData/Build/Products/$CONFIGURATION-iphoneos/WaffleStore.app" \
            build/package/Payload/WaffleStore.app
          cd build/package
          zip -qry "../../artifacts/WaffleStore-$CONFIGURATION.ipa" Payload
          cd ../..
          if [ -f scripts/verify-ipa.py ]; then
            python3 scripts/verify-ipa.py "artifacts/WaffleStore-$CONFIGURATION.ipa" | tee "artifacts/verification-$CONFIGURATION.json"
          fi
          if [ -f build/Native/unicorn-tci-corresponding-source.tar.gz ]; then
            cp build/Native/unicorn-tci-corresponding-source.tar.gz artifacts/
            cp build/Native/UNICORN-COPYING artifacts/
          fi
          if [ -f build/Native/ipatool-sap-corresponding-source.tar.gz ]; then
            cp build/Native/ipatool-sap-corresponding-source.tar.gz artifacts/
            cp build/Native/IPATOOL-LICENSE artifacts/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WaffleStore-Debug-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
